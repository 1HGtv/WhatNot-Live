<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whatnot Live Now</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
      line-height: 1.5;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }
    .header p {
      color: #aaa;
      font-size: 0.95rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      transition: transform 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .card-body {
      padding: 14px;
    }
    .card-body h2 {
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .card-body .title {
      color: #ccc;
      font-size: 0.9rem;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      display: inline-block;
      background: #2ecc71;
      color: #000;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .btn {
      display: block;
      text-align: center;
      background: #fcba03;
      color: #000;
      text-decoration: none;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }
    .btn:hover {
      background: #e0a800;
    }
    .empty {
      text-align: center;
      color: #888;
      padding: 60px 20px;
      grid-column: 1 / -1;
    }
    .updated {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Whatnot Live Now</h1>
    <p>Currently live shows • Affiliate links supported</p>
  </div>

  <div class="grid" id="lives">
    <div class="empty">Loading live shows...</div>
  </div>

  <div class="updated" id="updated"></div>

  <script>
    async function loadLives() {
      try {
        const res = await fetch('./live.json?t=' + Date.now());
        const data = await res.json();
        const container = document.getElementById('lives');
        const updated = document.getElementById('updated');

        if (!data.lives || data.lives.length === 0) {
          container.innerHTML = '<div class="empty">No one is live right now.<br>Check back soon.</div>';
        } else {
          container.innerHTML = data.lives.map(live => `
            <div class="card">
              <img src="${live.thumbnail || ''}" alt="${live.user}" onerror="this.style.display='none'">
              <div class="card-body">
                <div class="badge">${live.type || 'Show'}</div>
                <h2>${live.user}</h2>
                <div class="title">${live.title || ''}</div>
                <a class="btn" href="${live.url}" target="_blank" rel="noopener">Watch Live</a>
              </div>
            </div>
          `).join('');
        }

        if (data.updated) {
          updated.textContent = 'Last updated: ' + new Date(data.updated).toLocaleString();
        }
      } catch (err) {
        document.getElementById('lives').innerHTML = '<div class="empty">Failed to load live shows.</div>';
      }
    }

    loadLives();
    setInterval(loadLives, 60000); // refresh every 60 seconds
  </script>
</body>
</html>
