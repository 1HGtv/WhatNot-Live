<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening show…</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f0f0f; color: #fff; font-family: system-ui, sans-serif;
    }
    p { color: #aaa; }
    a { color: #fcba03; }
  </style>
</head>
<body>
  <div style="text-align:center;padding:24px">
    <p id="msg">Opening show…</p>
    <p><a id="fallback" href="#">Tap here if nothing happens</a></p>
  </div>
  <script>
    (function () {
      var to = new URLSearchParams(location.search).get("to");
      var a = document.getElementById("fallback");
      var msg = document.getElementById("msg");
      if (!to) {
        msg.textContent = "Missing link.";
        a.href = "https://1hgtv.github.io/WhatNot-Live/";
        a.textContent = "Back to live board";
        return;
      }
      a.href = to;
      try {
        location.replace(to);
      } catch (e) {
        msg.textContent = "Could not redirect automatically.";
      }
    })();
  </script>
</body>
</html>
